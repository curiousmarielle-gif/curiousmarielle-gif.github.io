<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#15191b">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'sha256-BCXU0TZR6d38MuW7kILDNSow8/AklFGn0oPASoTZEiY='; style-src-attr 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Tick-Primed Hypersensitivity in Cosmetic and Aesthetic Procedures</title>
<style>
:root{
  color-scheme:dark;
  --surface:#15191b;
  --paper:#f1eee8;
  --muted:#e1dcd4;
  --accent:#a99983;
  --line:#555653;
  --radius-control:4px;
  --radius-panel:6px;
  --radius-section:8px;
}
*{box-sizing:border-box}
html{background:var(--surface)}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:64px 32px;
  background:var(--surface);
  color:var(--paper);
  font-family:Arial,"Helvetica Neue",sans-serif;
  font-size:18px;
  line-height:1.55;
}
main{width:100%;max-width:840px;padding:40px 0;border-top:1px solid var(--accent)}
header{padding-bottom:36px;border-bottom:1px solid var(--line)}
h1{margin:0;max-width:36ch;font-size:clamp(30px,3.4vw,42px);line-height:1.2;letter-spacing:-.02em;font-weight:700}
p{margin:0;max-width:52ch}
.descriptor{margin-top:20px;font-size:18px;line-height:1.5;color:var(--muted)}
.status{margin-top:24px;font-size:20px;line-height:1.5;color:var(--paper)}
.release-details{padding-top:32px}
.release-date{font-size:20px;line-height:1.5;font-weight:700;color:var(--paper)}
.preview-note{margin-top:12px;font-size:16px;line-height:1.5;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:8px;border-radius:var(--radius-control)}
::selection{background:var(--accent);color:var(--surface)}
@media(max-width:600px){
  body{padding:40px 24px}
  main{padding-block:32px}
  header{padding-bottom:28px}
  h1{max-width:none}
  .descriptor{margin-top:18px}
  .status{margin-top:24px}
  .release-details{padding-top:28px}
  .release-date{font-size:18px}
}
@media print{
  :root{color-scheme:light}
  html,body{background:#fff;color:#15191b}
  body{display:block;min-height:0;padding:24px}
  main{max-width:none;border-top-color:#15191b}
  header{border-bottom-color:#555653}
  header p,.release-date,.preview-note{color:#15191b}
}
</style>
</head>
<body>
<main tabindex="-1" aria-labelledby="cover-title">
  <header>
    <h1 id="cover-title">Tick-Primed Hypersensitivity in Cosmetic and Aesthetic Procedures</h1>
    <p class="descriptor">Clinical companion</p>
    <p class="status">Finalized for presentation.</p>
  </header>
  <div class="release-details">
    <p class="release-date">Public release <time datetime="2026-09-22">September 22, 2026.</time></p>
    <p class="preview-note">Preview access for invited reviewers.</p>
  </div>
</main>
</body>
</html>
